name: Build CV and Release PDF

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: write  # Required for creating releases and uploading assets

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Code
        uses: actions/checkout@v7

      - name: Set up LaTeX
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Compile LaTeX to PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=. cv_latex.tex
          cp cv_latex.pdf Diogo_Santos_Martins_CV.pdf
        working-directory: ${{ github.workspace }}

      # Everything below only runs for tags; branch pushes and pull requests stop after the build check.
      - name: Create Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ./Diogo_Santos_Martins_CV.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Release URL
        if: startsWith(github.ref, 'refs/tags/')
        run: |
            echo "Release URL: ${{ steps.create_release.outputs.url }}"
